[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-secret-shield"
version = "1.0.0"
description = "Zero-dependency offline secret detection engine and git pre-commit hook guardian using Shannon entropy and signature matching."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Ethan Kilmer", email = "ethan@twu.software" }
]
keywords = [
    "security",
    "secret-detection",
    "git-hook",
    "pre-commit",
    "shannon-entropy",
    "devsecops",
    "credential-leak",
    "zero-dependency",
    "offline-security",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
secretshield = "secretshield.cli:main"

[project.urls]
Homepage = "https://github.com/Ethan-da-Tech-Wizard/git-secret-shield"
Repository = "https://github.com/Ethan-da-Tech-Wizard/git-secret-shield.git"
Issues = "https://github.com/Ethan-da-Tech-Wizard/git-secret-shield/issues"
