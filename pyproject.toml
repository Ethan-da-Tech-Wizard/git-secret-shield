[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-secret-shield"
version = "1.0.0"
description = "Project exploring secret detection and Git pre-commit checks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Ethan-da-Tech-Wizard" }
]
keywords = [
    "security",
    "secret-detection",
    "git-hook",
    "pre-commit",
    "shannon-entropy",
    "devsecops",
    "credential-leak",
    "standard-library-only",
    "offline-security",
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
secretshield = "secretshield.cli:main"

[project.urls]
Homepage = "https://github.com/Ethan-da-Tech-Wizard/git-secret-shield"
Repository = "https://github.com/Ethan-da-Tech-Wizard/git-secret-shield.git"
Issues = "https://github.com/Ethan-da-Tech-Wizard/git-secret-shield/issues"
