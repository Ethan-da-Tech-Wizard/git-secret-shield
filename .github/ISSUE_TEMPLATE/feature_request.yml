name: Feature request
description: Suggest a change or addition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations: {required: true}
  - type: textarea
    id: alt
    attributes:
      label: Alternatives you considered
